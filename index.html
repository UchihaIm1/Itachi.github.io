<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Лаборатория Солнечной системы</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#000;
    font-family:'Segoe UI', Arial, sans-serif; color:#dfe6ee; }
  #cv { display:block; position:fixed; inset:0; cursor:grab; }
  #cv.dragging { cursor:grabbing; }
  #header {
    position:fixed; top:0; left:0; right:0; padding:14px 22px; z-index:10;
    display:flex; justify-content:space-between; align-items:center; pointer-events:none;
    background:linear-gradient(180deg, rgba(0,0,0,.7), transparent);
  }
  #header h1 { font-size:19px; font-weight:600; letter-spacing:2px; color:#ffd97a;
    text-shadow:0 0 14px rgba(255,180,60,.5); }
  #header .hint { font-size:12px; color:#9fb2c8; }
  #info-panel {
    position:fixed; top:70px; right:-440px; width:410px; max-height:calc(100vh - 100px);
    overflow-y:auto; padding:24px; border-radius:14px; z-index:20;
    background:rgba(10,14,24,.93); border:1px solid rgba(120,160,255,.25);
    box-shadow:0 0 40px rgba(60,120,255,.15); backdrop-filter:blur(8px);
    transition:right .5s cubic-bezier(.22,.9,.3,1);
  }
  #info-panel.open { right:16px; }
  #info-panel h2 { color:#ffd97a; margin-bottom:2px; font-size:23px; }
  #info-panel .type { color:#7fa8e0; font-size:11px; text-transform:uppercase;
    letter-spacing:2px; margin-bottom:12px; }
  #info-panel .desc { font-size:13px; line-height:1.6; color:#c4d2e4; margin:12px 0; }
  #info-panel table { width:100%; border-collapse:collapse; font-size:13px; }
  #info-panel td { padding:6px 4px; border-bottom:1px solid rgba(255,255,255,.07); vertical-align:top; }
  #info-panel td:first-child { color:#8ea4bf; width:46%; }
  #info-panel td:last-child { color:#eef3fa; }
  #info-panel h3 { color:#a8c8ff; font-size:15px; margin:16px 0 8px;
    border-left:3px solid #ffd97a; padding-left:8px; }
  #close-btn { position:absolute; top:12px; right:14px; background:none; border:none;
    color:#8ea4bf; font-size:22px; cursor:pointer; }
  #close-btn:hover { color:#fff; }
  #belt-btn { position:fixed; bottom:20px; left:20px; z-index:15; cursor:pointer;
    padding:10px 18px; border-radius:10px; font-size:13px; color:#dfe6ee;
    background:rgba(20,28,48,.85); border:1px solid rgba(255,217,122,.4); transition:all .25s; }
  #belt-btn:hover { background:rgba(50,60,90,.9); box-shadow:0 0 16px rgba(255,217,122,.3); }
  #label { position:fixed; padding:4px 10px; border-radius:8px; background:rgba(0,0,0,.7);
    border:1px solid rgba(255,255,255,.2); font-size:11px; color:#fff;
    pointer-events:none; transform:translate(-50%,-160%); display:none; z-index:5; white-space:nowrap; }
  #loader { position:fixed; inset:0; background:#000; z-index:100;
    display:flex; flex-direction:column; justify-content:center; align-items:center; gap:18px;
    animation:hideLoader .8s ease 1.2s forwards; }
  @keyframes hideLoader { to { opacity:0; visibility:hidden; } }
  #loader .sun { width:70px; height:70px; border-radius:50%;
    background:radial-gradient(circle, #fff7d6, #ffb640 60%, transparent 72%);
    animation:pulse 1.6s ease-in-out infinite; box-shadow:0 0 60px 20px rgba(255,180,60,.45); }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.18)} }
  #loader p { color:#9fb2c8; letter-spacing:3px; font-size:13px; }
  #speed-panel { position:fixed; bottom:20px; right:20px; z-index:15;
    background:rgba(20,28,48,.85); border:1px solid rgba(120,160,255,.25);
    border-radius:10px; padding:10px 14px; display:flex; gap:8px; align-items:center; }
  #speed-panel button { background:rgba(60,80,120,.5); border:1px solid rgba(150,180,255,.3);
    color:#dfe6ee; border-radius:6px; padding:4px 10px; cursor:pointer; font-size:13px; }
  #speed-panel button:hover { background:rgba(90,110,160,.6); }
  #speed-val { font-size:13px; color:#ffd97a; min-width:46px; text-align:center; }
  .ctl-btn { position:fixed; bottom:20px; z-index:15; cursor:pointer;
    padding:10px 18px; border-radius:10px; font-size:13px; color:#dfe6ee;
    background:rgba(20,28,48,.85); border:1px solid rgba(255,217,122,.4); transition:all .25s; }
  .ctl-btn:hover { background:rgba(50,60,90,.9); box-shadow:0 0 16px rgba(255,217,122,.3); }
  #trail-btn { left:290px; }
  #follow-btn { left:440px; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="header">

</div>
<div id="loader"><div class="sun"></div><p>ЗАГРУЗКА СОЛНЕЧНОЙ СИСТЕМЫ...</p></div>

// ==================== КАМЕРА (3D) ====================
// Орбитальная плоскость — XY, ось полёта Солнца — Z (на экране идёт слева направо).
// ПКМ-перетаскивание: по горизонтали — наклон ракурса, по вертикали — вращение вокруг оси полёта.
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W, H, DPR;
function resize(){
  DPR = Math.min(devicePixelRatio||1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  cv.style.width = W+'px'; cv.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);

// мир -> экран (ортографическая проекция); третье значение — глубина (больше = дальше)
function proj(wx, wy, wz){
  const dx = wx-cam.x, dy = wy-cam.y, dz = wz-cam.z;
  const c = Math.cos(cam.rot), s = Math.sin(cam.rot);
  const xr = dx*c - dy*s, yr = dx*s + dy*c;
  const st = Math.sin(cam.tilt), ct = Math.cos(cam.tilt);
  return [W/2 + (dz*ct + xr*st)*cam.scale, H/2 + yr*cam.scale, dz*st - xr*ct];
}
// экран -> точка орбитальной плоскости на уровне камеры (зум к курсору)
function s2plane(sx, sy){
  const st = Math.sin(cam.tilt);
  if(Math.abs(st) < 0.15) return null;
  const xr = (sx-W/2)/(cam.scale*st), yr = (sy-H/2)/cam.scale;
  const c = Math.cos(cam.rot), s = Math.sin(cam.rot);
  return [cam.x + xr*c + yr*s, cam.y - xr*s + yr*c];
}

// Солнце летит по прямой; планеты кружатся вокруг него => винтовые линии
function sunPos(t){ return [0, 0, VZ*t]; }
function planetPos(p, t){
  const a = p.phase + t*p[4];
  return [Math.cos(a)*p[2], Math.sin(a)*p[2], VZ*t];
}
function moonPos(m, t){

  return [pp[0]+Math.cos(a)*m[3], pp[1]+Math.sin(a)*m[3], pp[2]];
}

function lighten(n, k){
  const r = (n>>16)&255, g = (n>>8)&255, b = n&255;
  return [Math.round(r+(255-r)*k), Math.round(g+(255-g)*k), Math.round(b+(255-b)*k)];
}

function drawBody(sx, sy, r, color, glow){

function drawOrbit(c, radius, alpha){
  ctx.strokeStyle = 'rgba(70,95,130,'+alpha+')'; ctx.lineWidth = 1;

    const pt = proj(c[0]+Math.cos(a)*radius, c[1]+Math.sin(a)*radius, c[2]);
    if(i===0) ctx.moveTo(pt[0],pt[1]); else ctx.lineTo(pt[0],pt[1]);

// Красивый след: светящаяся лента, сужается и гаснет к «прошлому»,
// части витка ближе к зрителю ярче и толще (ощущение глубины)
function drawTrail(p){
  const col = lighten(p[1], 0.35);
  const R = p[2];
  const N = Math.max(40, Math.min(480, Math.ceil(TRAIL_T*p[4]/0.15)));
  const per = 4, CH = Math.ceil(N/per);
  const cr = Math.cos(cam.rot), sr = Math.sin(cam.rot);
  const depthK = Math.cos(cam.tilt);          // при взгляде вдоль оси глубины нет
  const near = pos => 0.5 + 0.5*depthK*((pos[0]*cr - pos[1]*sr)/R);
  const p0 = planetPos(p, simT);
  let prev = proj(p0[0], p0[1], p0[2]);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.globalCompositeOperation = 'lighter';
  for(let ch=0; ch<CH; ch++){
    const age = (ch+0.5)/CH;
    const fade = Math.pow(1-age, 1.5);
    ctx.beginPath(); ctx.moveTo(prev[0], prev[1]);
    let nf = 0.5;
    for(let k=1;k<=per;k++){
      const i = ch*per+k; if(i>N) break;
      const q = planetPos(p, simT - TRAIL_T*i/N);
      prev = proj(q[0], q[1], q[2]);
      ctx.lineTo(prev[0], prev[1]);
      nf = near(q);
    }
    const a = fade*(0.3+0.7*nf);
    const w = (0.7+2.0*(1-age))*(0.75+0.5*nf);
    ctx.strokeStyle = 'rgba('+col[0]+','+col[1]+','+col[2]+','+(0.20*a).toFixed(3)+')';
    ctx.lineWidth = w*4.5; ctx.stroke();                       // мягкое свечение
    ctx.strokeStyle = 'rgba('+col[0]+','+col[1]+','+col[2]+','+Math.min(1,a*1.05).toFixed(3)+')';
    ctx.lineWidth = w; ctx.stroke();                           // яркое ядро
  }
  ctx.globalCompositeOperation = 'source-over';
}

// золотой хвост Солнца
function drawSunBeam(sun){
  const tail = proj(0, 0, VZ*(simT - TRAIL_T*1.1));
  if(Math.hypot(tail[0]-sun[0], tail[1]-sun[1]) < 3) return;
  const g = ctx.createLinearGradient(sun[0], sun[1], tail[0], tail[1]);
  g.addColorStop(0,   'rgba(255,220,130,1)');
  g.addColorStop(0.4, 'rgba(255,172,70,0.45)');
  g.addColorStop(1,   'rgba(255,140,50,0)');
  ctx.lineCap = 'round'; ctx.strokeStyle = g;
  ctx.globalCompositeOperation = 'lighter';
  [[22,0.10],[10,0.18],[4.5,0.38],[1.8,0.95]].forEach(l=>{
    ctx.globalAlpha = l[1]; ctx.lineWidth = l[0];
    ctx.beginPath(); ctx.moveTo(sun[0], sun[1]); ctx.lineTo(tail[0], tail[1]); ctx.stroke();
  });
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

// ==================== СОЛНЦЕ (мелкозернистая текстура, красное гало) ====================
// Текстура диска рисуется один раз в отдельный холст, потом масштабируется — быстро и детально.
const SUN_TEX = (function(){
  const R = 320, TAU = Math.PI*2;
  const c = document.createElement('canvas'); c.width = c.height = R*2;
  const x = c.getContext('2d');
  x.translate(R, R);
  x.save();
  x.beginPath(); x.arc(0,0,R,0,TAU); x.clip();

  // основа: яркий оранжевый, к краю краснее
  let g = x.createRadialGradient(-R*0.08,-R*0.08,R*0.1, 0,0,R);
  g.addColorStop(0,'#ff8c2c'); g.addColorStop(0.7,'#fb7222'); g.addColorStop(0.93,'#e65414'); g.addColorStop(1,'#bb390c');
  x.fillStyle = g; x.fillRect(-R,-R,R*2,R*2);

  const front = ()=>{               // случайная точка на видимой полусфере
    const lon = (Math.random()-0.5)*Math.PI, lat = Math.asin(2*Math.random()-1), cl = Math.cos(lat);
    return { X:cl*Math.sin(lon), Y:-Math.sin(lat), Z:cl*Math.cos(lon) };
  };

  // крупные мягкие неоднородности яркости
  for(let i=0;i<150;i++){
    const p = front(); if(p.Z < 0.1) continue;
    const px = p.X*R, py = p.Y*R, rad = R*(0.05+Math.random()*0.15)*(0.4+p.Z);
    const dark = Math.random() < 0.55;
    const gg = x.createRadialGradient(px,py,0, px,py,rad);
    gg.addColorStop(0, dark ? 'rgba(140,28,3,0.26)' : 'rgba(255,165,70,0.15)');
    gg.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = gg; x.beginPath(); x.arc(px,py,rad,0,TAU); x.fill();
  }

  // мелкая зернистость: тёмные прожилки и светлые крапинки (корзины по прозрачности)
  const dark = [0.22,0.32,0.46].map(a=>({a, p:new Path2D()}));
  const lite = [0.25,0.42,0.65].map(a=>({a, p:new Path2D()}));
  for(let i=0;i<19000;i++){
    const p = front(); if(p.Z < 0.04) continue;
    const isDark = Math.random() < 0.58;
    const px = p.X*R, py = p.Y*R, ang = Math.atan2(py,px);
    const s = R*(0.005+Math.random()*0.011)*(isDark?1:0.7);
    const rx = s*Math.max(p.Z,0.15)*(0.8+Math.random()*0.8), ry = s*(1.3+Math.random()*1.7);
    const rot = ang + (Math.random()-0.5)*1.4;
    const b = (isDark?dark:lite)[Math.floor(Math.random()*3)].p;
    b.moveTo(px+rx*Math.cos(rot), py+rx*Math.sin(rot));
    b.ellipse(px,py,rx,ry,rot,0,TAU);
  }
  dark.forEach(b=>{ x.fillStyle = 'rgba(95,14,0,'+b.a+')'; x.fill(b.p); });
  lite.forEach(b=>{ x.fillStyle = 'rgba(255,185,105,'+b.a+')'; x.fill(b.p); });

  // яркие активные области (положения как на снимке)
  [[0.54,-0.42,0.17],[-0.54,0.49,0.19],[0.89,-0.19,0.07],[-0.12,-0.62,0.05],[0.3,0.35,0.04]].forEach(a=>{
    const px = a[0]*R, py = a[1]*R, rad = R*a[2];
    const gg = x.createRadialGradient(px,py,0, px,py,rad*1.5);
    gg.addColorStop(0,'rgba(255,238,200,0.95)'); gg.addColorStop(0.35,'rgba(255,170,80,0.55)'); gg.addColorStop(1,'rgba(255,100,30,0)');
    x.fillStyle = gg; x.beginPath(); x.ellipse(px,py,rad*1.5,rad*1.1,Math.atan2(py,px),0,TAU); x.fill();
    x.fillStyle = 'rgba(255,235,185,0.85)';
    for(let k=0;k<70;k++){
      const aa = Math.random()*TAU, rr = rad*1.4*Math.sqrt(Math.random());
      x.beginPath(); x.arc(px+Math.cos(aa)*rr, py+Math.sin(aa)*rr*0.8, R*(0.002+Math.random()*0.006), 0, TAU); x.fill();
    }
  });
  // россыпь белых искр по диску
  x.fillStyle = 'rgba(255,220,165,0.8)';
  for(let i=0;i<260;i++){
    const p = front(); if(p.Z < 0.1) continue;
    x.beginPath(); x.arc(p.X*R, p.Y*R, R*(0.0015+Math.random()*0.004), 0, TAU); x.fill();
  }

  // потемнение к краю
  g = x.createRadialGradient(0,0,R*0.7, 0,0,R);
  g.addColorStop(0,'rgba(120,20,0,0)'); g.addColorStop(1,'rgba(120,20,0,0.55)');
  x.fillStyle = g; x.fillRect(-R,-R,R*2,R*2);
  x.restore();
  return c;
})();

function drawSun(cx, cy, r, t){
  const TAU = Math.PI*2;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';

  // широкое тёмно-красное свечение
  let g = ctx.createRadialGradient(cx,cy,r*0.9, cx,cy,r*5);
  g.addColorStop(0,'rgba(255,70,15,0.3)'); g.addColorStop(1,'rgba(120,15,0,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx,cy,r*5,0,TAU); ctx.fill();

  // плотное красное гало у самого края
  g = ctx.createRadialGradient(cx,cy,r*0.96, cx,cy,r*1.9);
  g.addColorStop(0,'rgba(255,90,18,1)'); g.addColorStop(0.2,'rgba(235,55,10,0.65)');
  g.addColorStop(0.55,'rgba(130,22,0,0.2)'); g.addColorStop(1,'rgba(60,5,0,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx,cy,r*1.9,0,TAU); ctx.fill();

  // диск (медленно вращается)
  ctx.globalCompositeOperation = 'source-over';
  ctx.translate(cx, cy); ctx.rotate(t*0.012);
  ctx.drawImage(SUN_TEX, -r, -r, r*2, r*2);
  ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.16;   // подсветка
  ctx.drawImage(SUN_TEX, -r, -r, r*2, r*2);
  ctx.restore();
}

// ==================== ТЕКСТУРЫ ПЛАНЕТ И СПУТНИКОВ ====================
const TAU = Math.PI*2;
const rnd = (a,b)=>a+Math.random()*(b-a);
function mkTex(draw){
  const R = 128, c = document.createElement('canvas'); c.width = c.height = R*2;
  const x = c.getContext('2d'); x.translate(R,R);
  x.beginPath(); x.arc(0,0,R,0,TAU); x.clip();
  draw(x,R); return c;
}
function fillDisc(x,R,col){ x.fillStyle = col; x.fillRect(-R,-R,R*2,R*2); }
function blobAt(x,px,py,rr,rgb,alpha){
  const g = x.createRadialGradient(px,py,0, px,py,rr);
  g.addColorStop(0,'rgba('+rgb+','+alpha+')'); g.addColorStop(1,'rgba('+rgb+',0)');
  x.fillStyle = g; x.beginPath(); x.arc(px,py,rr,0,TAU); x.fill();
}
function blobs(x,R,n,rgb,alpha,r0,r1){
  for(let i=0;i<n;i++){
    const a = rnd(0,TAU), d = R*Math.sqrt(Math.random());
    blobAt(x, Math.cos(a)*d, Math.sin(a)*d, R*rnd(r0,r1), rgb, alpha);
  }
}
function craters(x,R,n,s0,s1,dk){
  dk = dk || 0.28;
  for(let i=0;i<n;i++){
    const a = rnd(0,TAU), d = R*Math.sqrt(Math.random())*0.97;
    const px = Math.cos(a)*d, py = Math.sin(a)*d, rr = R*rnd(s0,s1);
    const g = x.createRadialGradient(px,py,rr*0.1, px,py,rr);
    g.addColorStop(0,'rgba(0,0,0,'+dk+')'); g.addColorStop(0.8,'rgba(0,0,0,'+(dk*0.4)+')'); g.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle = g; x.beginPath(); x.arc(px,py,rr,0,TAU); x.fill();
    x.strokeStyle = 'rgba(255,255,255,0.14)'; x.lineWidth = Math.max(0.6, rr*0.12);
    x.beginPath(); x.arc(px-rr*0.08, py-rr*0.08, rr*0.92, Math.PI*0.9, Math.PI*1.9); x.stroke();
  }
}
// горизонтальные волнистые полосы (газовые гиганты)
function bandsFill(x,R,lights,darks,w0,w1,amp){
  let y = -R, k = 0;
  while(y < R){
    const h = R*rnd(w0,w1), set = (k%2) ? darks : lights;
    const ph = rnd(0,TAU), f = rnd(0.02,0.06), am = amp*rnd(0.5,1.4);
    x.fillStyle = set[Math.floor(Math.random()*set.length)];
    x.beginPath();
    for(let xx=-R; xx<=R; xx+=6){ const yy = y + Math.sin(xx*f+ph)*am; if(xx===-R) x.moveTo(xx,yy); else x.lineTo(xx,yy); }
    for(let xx=R; xx>=-R; xx-=6){ x.lineTo(xx, y + h + Math.sin(xx*f*1.3+ph+1)*am); }
    x.closePath(); x.fill(); y += h; k++;
  }
}
function streaks(x,R,n,col,a0,a1,l0,l1){
  x.fillStyle = col;
  for(let i=0;i<n;i++){
    x.globalAlpha = rnd(a0,a1);
    x.beginPath(); x.ellipse(rnd(-R,R), rnd(-R,R), R*rnd(l0,l1), R*rnd(0.008,0.025), 0, 0, TAU); x.fill();
  }
  x.globalAlpha = 1;
}
function land(x,R,pts,col){
  x.fillStyle = col; x.strokeStyle = col; x.lineJoin = 'round'; x.lineWidth = R*0.05;
  x.beginPath();
  pts.forEach((p,i)=>{ if(i) x.lineTo(p[0]*R,p[1]*R); else x.moveTo(p[0]*R,p[1]*R); });
  x.closePath(); x.fill(); x.stroke();
}

// сфера с освещением со стороны Солнца
function drawSphere(px, py, r, key, sunS){
  const tex = PLANET_TEX[key];
  if(key==='earth' || key==='venus' || key==='titan'){   // атмосфера
    const col = key==='earth' ? '110,170,255' : (key==='venus' ? '255,220,150' : '255,190,90');
    const g = ctx.createRadialGradient(px,py,r*0.95, px,py,r*1.28);
    g.addColorStop(0,'rgba('+col+',0.5)'); g.addColorStop(1,'rgba('+col+',0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(px,py,r*1.28,0,TAU); ctx.fill();
  }
  ctx.save();
  ctx.beginPath(); ctx.arc(px,py,r,0,TAU); ctx.clip();
  if(tex) ctx.drawImage(tex, px-r, py-r, r*2, r*2);
  else { ctx.fillStyle = '#b0b8c0'; ctx.fillRect(px-r,py-r,r*2,r*2); }
  let dx = sunS[0]-px, dy = sunS[1]-py; const d = Math.hypot(dx,dy) || 1; dx /= d; dy /= d;
  const lx = px + dx*r*0.5, ly = py + dy*r*0.5;
  const sh = ctx.createRadialGradient(lx,ly,r*0.15, lx,ly,r*1.65);
  sh.addColorStop(0,'rgba(0,0,0,0)'); sh.addColorStop(0.5,'rgba(0,0,6,0.12)');
  sh.addColorStop(0.8,'rgba(0,0,10,0.62)'); sh.addColorStop(1,'rgba(0,0,12,0.9)');
  ctx.fillStyle = sh; ctx.fillRect(px-r,py-r,r*2,r*2);
  ctx.restore();
}
// кольца Сатурна (задняя половина — до планеты, передняя — после)
function drawRings(px, py, r, front){
  ctx.save(); ctx.translate(px,py); ctx.rotate(-0.38); ctx.scale(1,0.34);
  [[1.28,1.5,'rgba(150,130,100,0.35)'],[1.52,1.98,'rgba(226,204,152,0.92)'],
   [2.03,2.32,'rgba(190,168,125,0.78)'],[2.36,2.42,'rgba(170,150,110,0.4)']].forEach(d=>{
    ctx.strokeStyle = d[2]; ctx.lineWidth = (d[1]-d[0])*r;
    ctx.beginPath(); ctx.arc(0,0,(d[0]+d[1])/2*r, front?0:Math.PI, front?Math.PI:TAU); ctx.stroke();
  });
  ctx.restore();
}
function drawUranusRings(px, py, r){
  ctx.save(); ctx.translate(px,py); ctx.rotate(1.35); ctx.scale(1,0.28);
  ctx.strokeStyle = 'rgba(190,215,225,0.4)'; ctx.lineWidth = Math.max(0.6, r*0.03);
  [1.5,1.7,1.9].forEach(k=>{ ctx.beginPath(); ctx.arc(0,0,k*r,0,TAU); ctx.stroke(); });
  ctx.restore();
}

function render(dt){
  ctx.fillStyle = '#020308';
  ctx.fillRect(0,0,W,H);
  const ctS = Math.cos(cam.tilt);
  const ct = Math.max(Math.abs(ctS), 0.15);

  // ---- Млечный Путь ----
  ctx.save();
  ctx.translate(W/2, H/2); ctx.rotate(0.5);
  const mg = ctx.createLinearGradient(0,-H*0.35, 0, H*0.35);
  mg.addColorStop(0,'rgba(40,55,110,0)');
  mg.addColorStop(0.5,'rgba(80,100,170,0.16)');
  mg.addColorStop(1,'rgba(40,55,110,0)');
  ctx.fillStyle = mg;
  ctx.fillRect(-W, -H*0.35, W*2, H*0.7);
  ctx.restore();

  // ---- далёкие звёзды (плывут назад с параллаксом) ----
  const Wp = W + 40;
  const t = performance.now();
  bgStars.forEach(s=>{
    const sx = (((s.u*Wp - cam.z*0.25*s.d*ctS) % Wp) + Wp) % Wp - 20;
    const sy = s.v*H;
    ctx.globalAlpha = 0.5 + 0.45*Math.sin(t/900 + s.tw);
    ctx.fillStyle = s.col;
    ctx.fillRect(sx, sy, s.sz, s.sz);
  });
  ctx.globalAlpha = 1;

  // ---- близкие звёзды ----
  NEAR_STARS.forEach(st=>{
    const sx = (((st.u*Wp - cam.z*0.06*ctS) % Wp) + Wp) % Wp - 20;
    const sy = st.v*H;
    const g = ctx.createRadialGradient(sx,sy,0,sx,sy,st.sz*5);
    g.addColorStop(0, st.col); g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.globalAlpha = 0.8; ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(sx,sy,st.sz*5,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1; ctx.fillStyle = st.col;
    ctx.beginPath(); ctx.arc(sx,sy,st.sz,0,Math.PI*2); ctx.fill();
    if(cam.scale > 0.4) drawLabel(sx, sy+8, st.name, false);
  });

  const sp = sunPos(simT);
  const sunS = proj(sp[0], sp[1], sp[2]);

  // ---- космическая пыль (даёт ощущение скорости) ----
  {
    const tailLen = Math.max(-18, Math.min(18, VZ*speed*ctS*cam.scale*0.3));
    ctx.globalCompositeOperation = 'lighter';
    DUST.forEach(d=>{
      const zrel = (((d.z0 - cam.z) % DUST_L) + DUST_L) % DUST_L - DUST_L/2;
      const pt = proj(d.x, d.y, cam.z + zrel);
      if(pt[0]<-30||pt[0]>W+30||pt[1]<-5||pt[1]>H+5) return;
      ctx.globalAlpha = 0.18 + 0.2*d.sz;
      ctx.fillStyle = d.col;
      ctx.fillRect(pt[0]-Math.max(tailLen,0), pt[1], Math.abs(tailLen)+d.sz, d.sz);
    });
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }

  // ---- текущие орбиты (в плоскости, где сейчас Солнце) ----
  PLANETS.forEach(p=>drawOrbit(sp, p[2], 0.26));
  MOONS.forEach(m=>{
    const pp = planetPos(planetByKey[m[1]], simT);
    drawOrbit(pp, m[3], 0.3);
  });

  // ---- пояс астероидов ----
  const rs = Math.min(cam.scale,2)*0.8+0.4;
  ctx.fillStyle = 'rgba(170,155,130,0.7)';
  beltRocks.forEach(rk=>{
    const a = rk.a + simT*rk.sp;
    const pt = proj(Math.cos(a)*rk.r, Math.sin(a)*rk.r, sp[2]);
    if(pt[0]<-10||pt[0]>W+10||pt[1]<-10||pt[1]>H+10) return;
    ctx.fillRect(pt[0], pt[1], rs*rk.sz, rs*rk.sz);
  });

  // ---- следы ----
  if(trailsOn){
    drawSunBeam(sunS);
    PLANETS.forEach(drawTrail);
  }

  // ---- тела: сортировка по глубине (дальние первыми) ----
  const items = [];
  PLANETS.forEach(p=>{
    const pos = planetPos(p, simT);
    const pt = proj(pos[0], pos[1], pos[2]);
    items.push({d:pt[2], fn:()=>{
      const r = Math.max(p[3]*cam.scale, 3);
      if(trailsOn){
        const hex = '#'+p[1].toString(16).padStart(6,'0');
        const gg = ctx.createRadialGradient(pt[0],pt[1],r*0.4, pt[0],pt[1],r*3.2);
        gg.addColorStop(0,hex); gg.addColorStop(1,'rgba(0,0,0,0)');
        ctx.globalAlpha = 0.3; ctx.fillStyle = gg;
        ctx.beginPath(); ctx.arc(pt[0],pt[1],r*3.2,0,TAU); ctx.fill(); ctx.globalAlpha = 1;
      }
      if(p[0]==='saturn') drawRings(pt[0], pt[1], r, false);
      drawSphere(pt[0], pt[1], r, p[0], sunS);
      if(p[0]==='saturn') drawRings(pt[0], pt[1], r, true);
      if(p[0]==='uranus') drawUranusRings(pt[0], pt[1], r);
      drawLabel(pt[0], pt[1]-r, INFO[p[0]].name, p[3]>8);
      return {x:pt[0], y:pt[1], r:Math.max(r+6,14), key:p[0]};
    }});
  });
  MOONS.forEach(m=>{
    const pos = moonPos(m, simT);
    const pt = proj(pos[0], pos[1], pos[2]);
    if(pt[0]<-20||pt[0]>W+20||pt[1]<-20||pt[1]>H+20) return;
    items.push({d:pt[2], fn:()=>{
      const r = Math.max(m[2]*cam.scale, 2);
      drawSphere(pt[0], pt[1], r, m[0], sunS);
      if(cam.scale>1.6) drawLabel(pt[0], pt[1]-r, INFO[m[0]].name, false);
      return {x:pt[0], y:pt[1], r:Math.max(r+5,10), key:m[0]};
    }});
  });
  items.push({d:sunS[2], fn:()=>{
    const r = Math.max(SUN_R*cam.scale, 6);
    drawSun(sunS[0], sunS[1], r, simT);
    drawLabel(sunS[0], sunS[1]-r, 'Солнце', true);
    return {x:sunS[0], y:sunS[1], r:Math.max(r+8,18), key:'sun'};
  }});
  items.sort((a,b)=>b.d-a.d);

  // пояс проверяется последним (приоритет у планет/спутников)
  const pick = [{belt:true, x:sunS[0], y:sunS[1], st:Math.sin(cam.tilt)}];
  items.forEach(it=>pick.push(it.fn()));
  window.__pick = pick;
}

const panel = document.getElementById('info-panel');
function openInfo(key){
  const d = INFO[key]; if(!d) return;
  document.getElementById('obj-name').textContent = d.name;
  document.getElementById('obj-type').textContent = d.type;
  document.getElementById('obj-desc').textContent = d.desc;
  document.getElementById('obj-table').innerHTML =
    d.facts.map(f=>'<tr><td>'+f[0]+'</td><td>'+f[1]+'</td></tr>').join('');
  const ex = document.getElementById('obj-extra');
  ex.innerHTML = d.extra ? '<h3>'+d.extra.title+'</h3>' +
    d.extra.items.map(i=>'<table><tr><td style="color:#ffd97a;width:38%">'+i[0]+'</td><td>'+i[1]+'</td></tr></table>').join('') : '';
  panel.classList.add('open');
}
document.getElementById('close-btn').onclick = ()=>{ panel.classList.remove('open'); focusObj=null; };
addEventListener('keydown', e=>{ if(e.key==='Escape'){ panel.classList.remove('open'); focusObj=null; } });
document.getElementById('belt-btn').onclick = ()=>{
  openInfo('belt');
  focusObj = {getPos:()=>sunPos(simT), dist:340};
};
document.getElementById('trail-btn').onclick = (e)=>{
  trailsOn = !trailsOn;
  e.currentTarget.textContent = trailsOn ? '🌀 Следы: вкл' : '🌀 Следы: выкл';
};
document.getElementById('follow-btn').onclick = (e)=>{
  followSun = !followSun;
  e.currentTarget.textContent = followSun ? '🎥 Камера: за Солнцем' : '🎥 Камера: свободная';
  if(followSun){ focusObj = null; const c0 = Math.cos(cam.tilt); cam.z = sunPos(simT)[2] - (Math.abs(c0)>0.3 ? 0.2*W/(cam.scale*c0) : 0); }
};

// ==================== УПРАВЛЕНИЕ МЫШЬЮ ====================
let focusObj = null;
let drag = null;
cv.addEventListener('contextmenu', e=>e.preventDefault());

cv.addEventListener('pointerdown', e=>{
  cv.setPointerCapture(e.pointerId);
  drag = { x:e.clientX, y:e.clientY, rot:cammotion(e), moved:0 };
  cv.classList.add('dragging');
});
function cammotion(e){ return e.button===2 || e.shiftKey ? 'rot' : 'pan'; }

cv.addEventListener('pointermove', e=>{
  if(drag){
    const dx = e.clientX-drag.x, dy = e.clientY-drag.y;
    drag.moved += Math.abs(dx)+Math.abs(dy);
    if(drag.rot==='rot'){
      cam.tilt += dx*0.004;   // без ограничений: полный оборот 360°
      cam.rot += dy*0.005;
    } else {
      const c = Math.cos(-cam.rot), s = Math.sin(-cam.rot);
      const st = Math.sin(cam.tilt), ct = Math.cos(cam.tilt);
      const dxr = -dx*st/cam.scale, dyr = -dy/cam.scale;
      cam.x += dxr*c - dyr*s;
      cam.y += dxr*s + dyr*c;
      cam.z += -dx*ct/cam.scale;
    }
    drag.x = e.clientX; drag.y = e.clientY;
    focusObj = null;
    return;
  }
  const h = hitTest(e.clientX, e.clientY);
  const lb = document.getElementById('label');
  if(h){
    lb.style.display='block'; lb.style.left=e.clientX+'px'; lb.style.top=e.clientY+'px';
    lb.textContent = INFO[h].name;
    cv.style.cursor = 'pointer';
  } else { lb.style.display='none'; cv.style.cursor='grab'; }
});

cv.addEventListener('pointerup', e=>{
  cv.classList.remove('dragging');
  const wasClick = drag && drag.moved < 6;
  drag = null;
  if(!wasClick) return;
  const h = hitTest(e.clientX, e.clientY);
  if(h){
    openInfo(h);
    if(h==='sun') focusObj = {getPos:()=>sunPos(simT), dist:110};
    else if(planetByKey[h]) focusObj = {getPos:()=>planetPos(planetByKey[h], simT), dist:planetByKey[h][3]*8};
    else if(moonByKey[h]) focusObj = {getPos:()=>moonPos(moonByKey[h], simT), dist:40};
    else if(NEAR_STARS.some(s=>s.key===h)) focusObj = null;
  } else { panel.classList.remove('open'); focusObj=null; }
});

function hitTest(sx, sy){
  const pick = window.__pick || [];
  for(let i=pick.length-1;i>=0;i--){
    const p = pick[i];
    if(p.belt){
      if(Math.abs(p.st) < 0.2) continue;
      const rho = Math.hypot((sx-p.x)/(cam.scale*p.st), (sy-p.y)/cam.scale);
      if(rho>247 && rho<318) return 'belt';
      continue;
    }
    if(Math.hypot(sx-p.x, sy-p.y) <= p.r) return p.key;
  }
  return null;
}

// зум колесом (к курсору, если ракурс позволяет)
cv.addEventListener('wheel', e=>{
  e.preventDefault();
  const f = Math.exp(-e.deltaY*0.0012);
  const before = s2plane(e.clientX, e.clientY);
  cam.scale = Math.min(8, Math.max(0.08, cam.scale*f));
  const after = s2plane(e.clientX, e.clientY);
  if(before && after){ cam.x += before[0]-after[0]; cam.y += before[1]-after[1]; }
  focusObj = null;
}, {passive:false});

// скорость симуляции
function setSpeed(v){
  speed = Math.min(8, Math.max(0, v));
  document.getElementById('speed-val').textContent = '×' + (Math.round(speed*10)/10);
}
document.getElementById('spd-up').onclick = ()=>setSpeed(speed*1.6);
document.getElementById('spd-down').onclick = ()=>setSpeed(speed/1.6);
document.getElementById('spd-reset').onclick = ()=>{
  homeCam(); focusObj = null; panel.classList.remove('open');
};

// плавный подлёт к объекту
function updateFocus(dt){
  if(!focusObj) return;
  const p = focusObj.getPos();
  const k = 1 - Math.pow(0.001, dt);
  cam.x += (p[0]-cam.x)*k;
  cam.y += (p[1]-cam.y)*k;
  cam.z += (p[2]-cam.z)*k;
  const targetScale = Math.min(8, Math.max(0.3, 200/focusObj.dist*0.6));
  cam.scale += (targetScale-cam.scale)*k*0.6;
}

// стрелки клавиатуры тоже вращают (для тачпадов без ПКМ)
addEventListener('keydown', e=>{
  const k = e.key;
  if(k==='ArrowLeft')  cam.tilt -= 0.08;
  else if(k==='ArrowRight') cam.tilt += 0.08;
  else if(k==='ArrowUp')    cam.rot -= 0.08;
  else if(k==='ArrowDown')  cam.rot += 0.08;
  else return;
  e.preventDefault();
});

// ==================== ЦИКЛ ====================
let last = performance.now();
function loop(now){
  const dt = Math.min((now-last)/1000, 0.05); last = now;
  const ds = dt*speed;
  simT += ds;
  if(followSun) cam.z += VZ*ds;   // камера летит вместе с Солнцем
  updateFocus(dt);
  render(dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
